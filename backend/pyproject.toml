[project]
name = "dockyard"
version = "0.1.0"
description = "Dockyard — self-hosted PaaS (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "itsdangerous>=2.2",
    "bcrypt>=5.0.0",
    "docker>=7.1.0",
    "pyyaml>=6.0.3",
    "shortuuid>=1.0.13",
    "faker>=40.21.0",
    "temporalio>=1.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    "black>=24.10",
]

[tool.black]
target-version = ["py313"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
