services:
  proxy:
    image: ghcr.io/kuluruvineeth/dockyard-proxy:canary
    command: caddy run --resume
    logging:
      driver: "fluentd"
      options:
        mode: "non-blocking"
        fluentd-address: "unix://$HOME/.fluentd/fluentd.sock"
        fluentd-async: "true"
        fluentd-max-retries: 10
        fluentd-sub-second-precision: "true"
        tag: '{"service_id":"dky.proxy"}'
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        # stop-first, because ports 80 and 443 are published in host mode.
        # start-first would need the replacement task to bind ports the
        # outgoing task still holds, so every update deadlocks on
        # "host-mode port already in use" and the proxy can never be updated.
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role==manager
      labels:
        dky.role: "proxy"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - "2019:2019"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    networks:
      dockyard:
        aliases:
          - dky.proxy
  temporal-admin-tools:
    image: temporalio/admin-tools:1.24.2-tctl-1.18.1-cli-1.0.0
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=dky.db
      - SKIP_SCHEMA_SETUP=false
      - SKIP_DB_SETUP=false
      - SERVICES=history,matching,frontend,worker
      - TEMPORAL_HOME=/etc/temporal
      - TEMPORAL_ADDRESS=dky.temporal:7233
      - TEMPORAL_CLI_ADDRESS=dky.temporal:7233
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - BIND_ON_IP=0.0.0.0
    volumes:
      - "./temporalio/admin-tools-entrypoint.sh:/etc/temporal/setup.sh"
    entrypoint:
      - /etc/temporal/setup.sh
    deploy:
      mode: replicated-job
      restart_policy:
        # Bounded. Without max_attempts a one-shot job that fails is retried
        # forever, and every attempt leaves a dead container behind — enough
        # of them to make the docker daemon stop responding.
        condition: on-failure
        max_attempts: 3
        delay: 10s
        window: 120s
    networks:
      - dockyard
volumes:
  caddy-data:
  caddy-config:
networks:
  dockyard:
    external: true
