services:
  temporal-ui:
    environment:
      - TEMPORAL_ADDRESS=dky.temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.42.1
    networks:
      dockyard:
        aliases:
          - dky.temporal_ui
    ports:
      - 8080:8080
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        dky.stack: "true"
      resources:
        limits:
          cpus: "0.1"
          memory: 100M
networks:
  dockyard:
    external: true
