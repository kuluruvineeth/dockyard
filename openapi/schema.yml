components:
  schemas:
    AuthedResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserSchema'
        membership:
          type: 'null'
          title: Membership
      type: object
      required:
      - user
      title: AuthedResponse
    AutoDeployRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
      type: object
      required:
      - enabled
      title: AutoDeployRequest
    CSRFResponse:
      properties:
        details:
          type: string
          title: Details
      type: object
      required:
      - details
      title: CSRFResponse
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          minLength: 1
          title: Current Password
        new_password:
          type: string
          minLength: 8
          title: New Password
        confirm_password:
          type: string
          minLength: 1
          title: Confirm Password
      type: object
      required:
      - current_password
      - new_password
      - confirm_password
      title: ChangePasswordRequest
    ChangePasswordResponse:
      properties:
        success:
          type: boolean
          title: Success
      type: object
      required:
      - success
      title: ChangePasswordResponse
    ChangeSchema:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        field:
          type: string
          title: Field
        item_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Item Id
        old_value:
          anyOf:
          - {}
          - type: 'null'
          title: Old Value
        new_value:
          anyOf:
          - {}
          - type: 'null'
          title: New Value
        applied:
          type: boolean
          title: Applied
      type: object
      required:
      - id
      - type
      - field
      - item_id
      - old_value
      - new_value
      - applied
      title: ChangeSchema
    ComposeStackSchema:
      properties:
        id:
          type: string
          title: Id
        slug:
          type: string
          title: Slug
        services:
          items:
            $ref: '#/components/schemas/ComposeStackServiceSchema'
          type: array
          title: Services
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - slug
      - services
      - created_at
      title: ComposeStackSchema
    ComposeStackServiceSchema:
      properties:
        id:
          type: string
          title: Id
        slug:
          type: string
          title: Slug
      type: object
      required:
      - id
      - slug
      title: ComposeStackServiceSchema
    ConfigSchema:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        mount_path:
          type: string
          title: Mount Path
        contents:
          type: string
          title: Contents
        language:
          type: string
          title: Language
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - name
      - mount_path
      - contents
      - language
      - version
      title: ConfigSchema
    CreateComposeStackRequest:
      properties:
        slug:
          type: string
          maxLength: 40
          minLength: 1
          pattern: ^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$
          title: Slug
        contents:
          type: string
          minLength: 1
          title: Contents
      type: object
      required:
      - slug
      - contents
      title: CreateComposeStackRequest
    CreateEnvironmentRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[a-zA-Z0-9]+(?:-[a-zA-Z0-9]+)*$
