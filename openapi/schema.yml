components:
  schemas:
    AuthedResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserSchema'
        membership:
          type: 'null'
          title: Membership
      type: object
      required:
      - user
      title: AuthedResponse
    CSRFResponse:
      properties:
        details:
          type: string
          title: Details
      type: object
      required:
      - details
      title: CSRFResponse
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          minLength: 1
          title: Current Password
        new_password:
          type: string
          minLength: 8
          title: New Password
        confirm_password:
          type: string
          minLength: 1
          title: Confirm Password
      type: object
      required:
      - current_password
      - new_password
      - confirm_password
      title: ChangePasswordRequest
    ChangePasswordResponse:
      properties:
        success:
          type: boolean
          title: Success
      type: object
      required:
      - success
      title: ChangePasswordResponse
    ChangeSchema:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        field:
          type: string
          title: Field
        item_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Item Id
        old_value:
          anyOf:
          - {}
          - type: 'null'
          title: Old Value
        new_value:
          anyOf:
          - {}
          - type: 'null'
          title: New Value
        applied:
          type: boolean
          title: Applied
      type: object
      required:
      - id
      - type
      - field
      - item_id
      - old_value
      - new_value
      - applied
      title: ChangeSchema
    ConfigSchema:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        mount_path:
          type: string
          title: Mount Path
        contents:
          type: string
          title: Contents
        language:
          type: string
          title: Language
        version:
          type: integer
          title: Version
      type: object
      required:
      - id
      - name
      - mount_path
      - contents
      - language
      - version
      title: ConfigSchema
    DeploymentListResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/DeploymentSchema'
          type: array
          title: Results
        count:
          type: integer
          title: Count
      type: object
      required:
      - results
      - count
      title: DeploymentListResponse
    DeploymentSchema:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          title: Status
        status_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Reason
        slot:
          type: string
          title: Slot
        is_current_production:
          type: boolean
          title: Is Current Production
        commit_message:
          type: string
          title: Commit Message
        queued_at:
          type: string
          format: date-time
          title: Queued At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
      type: object
      required:
      - id
      - status
      - status_reason
      - slot
      - is_current_production
      - commit_message
      - queued_at
      - started_at
      - finished_at
      title: DeploymentSchema
    DockerImageResult:
      properties:
        full_image:
          type: string
          title: Full Image
        description:
          type: string
          title: Description
      type: object
      required:
      - full_image
      - description
      title: DockerImageResult
    DockerImageSearchResponse:
      properties:
        images:
          items:
            $ref: '#/components/schemas/DockerImageResult'
          type: array
          title: Images
      type: object
      required:
      - images
      title: DockerImageSearchResponse
    DockerServiceCreateRequest:
      properties:
        slug:
          anyOf:
          - type: string
            maxLength: 255
            pattern: ^[-a-zA-Z0-9_]+$
          - type: 'null'
          title: Slug
        image:
          type: string
          minLength: 1
          title: Image
        container_registry_credentials_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Container Registry Credentials Id
      type: object
      required:
      - image
      title: DockerServiceCreateRequest
    EnvVariableSchema:
      properties:
        id:
          type: string
          title: Id
        key:
          type: string
          title: Key
        value:
          type: string
          title: Value
      type: object
      required:
      - id
      - key
      - value
      title: EnvVariableSchema
    HealthCheckSchema:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        value:
          type: string
          title: Value
        interval_seconds:
          type: integer
          title: Interval Seconds
        timeout_seconds:
          type: integer
          title: Timeout Seconds
        associated_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Associated Port
      type: object
      required:
      - id
      - type
      - value
      - interval_seconds
      - timeout_seconds
      - associated_port
      title: HealthCheckSchema
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 255
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 255
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    LoginSuccessResponse:
      properties:
        success:
          type: boolean
          title: Success
      type: object
      required:
      - success
      title: LoginSuccessResponse
    PingResponse:
      properties:
        ping:
          type: string
          const: pong
          title: Ping
          default: pong
      type: object
      title: PingResponse
    PortSchema:
      properties:
        id:
          type: string
          title: Id
        host:
          type: integer
          title: Host
        forwarded:
          type: integer
          title: Forwarded
      type: object
      required:
      - id
      - host
      - forwarded
      title: PortSchema
    ProjectCreateRequest:
      properties:
        slug:
          anyOf:
          - type: string
            maxLength: 255
            pattern: ^[-a-zA-Z0-9_]+$
          - type: 'null'
          title: Slug
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      title: ProjectCreateRequest
    ProjectSchema:
      properties:
